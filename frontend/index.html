<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>ShipVerify — Shipping Document Verification</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.24.7/babel.min.js"></script>
<style>
  :root {
    --bg: #0F1417;
    --panel: #171D21;
    --panel-2: #1D2429;
    --line: #2A3338;
    --text: #E8EDEF;
    --text-dim: #8A98A0;
    --ok: #3FB88A;
    --mismatch: #D9503A;
    --review: #D9A23B;
    --accent: #4C9FE8;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'IBM Plex Sans', system-ui, sans-serif;
    font-size: 14px;
  }
  code, .mono { font-family: 'IBM Plex Mono', monospace; }
  #root { display: flex; min-height: 100vh; }

  .sidebar {
    width: 210px;
    flex-shrink: 0;
    background: var(--panel);
    border-right: 1px solid var(--line);
    padding: 24px 0;
    position: sticky;
    top: 0;
    height: 100vh;
  }
  .brand { padding: 0 20px 20px; border-bottom: 1px solid var(--line); margin-bottom: 12px; }
  .brand h1 { font-size: 15px; margin: 0 0 2px; font-weight: 600; }
  .brand p { margin: 0; color: var(--text-dim); font-size: 12px; }
  .nav-item {
    display: block;
    padding: 10px 20px;
    color: var(--text-dim);
    cursor: pointer;
    border-left: 2px solid transparent;
    font-size: 13px;
    transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
  }
  .nav-item:hover { color: var(--text); }
  .nav-item.active { color: var(--text); border-left-color: var(--accent); background: var(--panel-2); }

  .main { flex: 1; padding: 28px 36px; max-width: 1100px; }
  h2 { font-size: 18px; font-weight: 600; margin: 0 0 4px; }
  .subtitle { color: var(--text-dim); margin: 0 0 24px; font-size: 13px; }

  .stat-row { display: flex; gap: 14px; margin-bottom: 24px; flex-wrap: wrap; }
  .stat {
    background: var(--panel);
    border: 1px solid var(--line);
    padding: 14px 18px;
    min-width: 130px;
  }
  .stat .n { font-size: 22px; font-weight: 600; font-family: 'IBM Plex Mono', monospace; }
  .stat .l { color: var(--text-dim); font-size: 12px; margin-top: 2px; }

  table { width: 100%; border-collapse: collapse; }
  th {
    text-align: left;
    color: var(--text-dim);
    font-weight: 500;
    font-size: 12px;
    padding: 8px 10px;
    border-bottom: 1px solid var(--line);
  }
  td { padding: 9px 10px; border-bottom: 1px solid var(--line); font-size: 13px; }
  tr.row { transition: background 0.12s ease; }
  tr.row:hover { background: var(--panel-2); cursor: pointer; }

  .cat-tag { display: inline-flex; align-items: center; gap: 7px; }
  .cat-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }

  .badge { display: inline-block; padding: 2px 8px; font-size: 12px; border: 1px solid; }
  .badge.OK { color: var(--ok); border-color: var(--ok); }
  .badge.MISMATCH { color: var(--mismatch); border-color: var(--mismatch); }
  .badge.NEEDS_REVIEW { color: var(--review); border-color: var(--review); }

  .filters { display: flex; gap: 10px; margin-bottom: 14px; }
  select, input[type=text] {
    background: var(--panel);
    border: 1px solid var(--line);
    color: var(--text);
    padding: 7px 10px;
    font-size: 13px;
    font-family: inherit;
  }

  .panel { background: var(--panel); border: 1px solid var(--line); padding: 20px; margin-bottom: 16px; }
  .field-row { display: grid; grid-template-columns: 160px 1fr 1fr; gap: 16px; padding: 12px 0; border-bottom: 1px solid var(--line); align-items: start; }
  .field-row:last-child { border-bottom: none; }
  .field-name { font-size: 13px; padding-top: 2px; }
  .field-val { font-family: 'IBM Plex Mono', monospace; font-size: 13px; }
  .field-evidence { color: var(--text-dim); font-size: 12px; margin-top: 4px; }
  .col-head { color: var(--text-dim); font-size: 12px; margin-bottom: 4px; }

  .btn {
    background: var(--panel-2);
    border: 1px solid var(--line);
    color: var(--text);
    padding: 8px 16px;
    font-size: 13px;
    cursor: pointer;
    font-family: inherit;
  }
  .btn { transition: border-color 0.15s ease, opacity 0.15s ease; }
  .btn:hover { border-color: var(--accent); }
  .btn:disabled { opacity: 0.35; cursor: not-allowed; }
  .btn:disabled:hover { border-color: var(--line); }
  .btn.primary { background: var(--ok); color: #08110D; border-color: var(--ok); font-weight: 500; }
  .btn.primary:hover { opacity: 0.9; border-color: var(--ok); }

  .radio-group { display: flex; gap: 16px; margin: 12px 0; }
  .radio-group label { display: flex; align-items: center; gap: 6px; cursor: pointer; font-size: 13px; }

  .checkbox-list { display: flex; flex-wrap: wrap; gap: 10px; margin: 10px 0; }
  .checkbox-list label { display: flex; align-items: center; gap: 5px; font-size: 13px; color: var(--text-dim); }

  .empty { color: var(--text-dim); padding: 40px 0; text-align: center; }
  .back-link { color: var(--text-dim); cursor: pointer; font-size: 13px; margin-bottom: 16px; display: inline-block; }
  .back-link:hover { color: var(--text); }
  .reviewed-note { border-left: 2px solid var(--ok); padding: 10px 14px; background: var(--panel-2); font-size: 13px; margin-bottom: 16px; }

  .state-message { padding: 80px 20px; text-align: center; color: var(--text-dim); font-size: 14px; }
  .state-message.error { color: var(--mismatch); }

  .case-nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; }
  .case-nav-btns { display: flex; gap: 8px; }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useMemo } = React;

// TODO: paste your Firebase Realtime Database URL here (same one used in
// upload_to_firebase.py), no trailing slash. Leave as-is to fall back to
// the local results.json file (useful for offline development).
const FIREBASE_DB_URL = "https://shippingdoc-e1113-default-rtdb.firebaseio.com";
const USING_FIREBASE = !FIREBASE_DB_URL.includes("YOUR-PROJECT");

const FIELDS = ["shipper", "consignee", "notify_party", "port_of_loading",
                "port_of_discharge", "container_count", "gross_weight_kg"];

const CATEGORY_COLORS = {
  BL_COMPARISON: "#5B8DBD",
  SI_REQUEST: "#4FAE9E",
  INVOICE_QUERY: "#C9A24B",
  GENERAL: "#7A8790",
  SPAM: "#B15C52",
};

function CategoryTag({ category }) {
  return (
    <span className="cat-tag">
      <span className="cat-dot" style={{background: CATEGORY_COLORS[category] || "#7A8790"}}></span>
      {category}
    </span>
  );
}

async function loadOverrides() {
  if (!USING_FIREBASE) {
    try { return JSON.parse(localStorage.getItem("shipverify_reviews_v1") || "{}"); }
    catch (e) { return {}; }
  }
  const resp = await fetch(`${FIREBASE_DB_URL}/reviews.json`);
  const data = await resp.json();
  return data || {};
}

async function saveOverride(emailId, override) {
  if (!USING_FIREBASE) {
    const all = JSON.parse(localStorage.getItem("shipverify_reviews_v1") || "{}");
    all[emailId] = override;
    localStorage.setItem("shipverify_reviews_v1", JSON.stringify(all));
    return;
  }
  // Firebase keys can't contain "." — email_ids here are plain
  // "email_NNN" so this is safe as-is.
  await fetch(`${FIREBASE_DB_URL}/reviews/${emailId}.json`, {
    method: "PUT",
    body: JSON.stringify(override),
  });
}

function finalStatus(id, result, overrides) {
  return overrides[id] ? overrides[id].status : result.status;
}
function finalDefectFields(id, result, overrides) {
  return overrides[id] ? overrides[id].defect_fields : result.defect_fields;
}

function Badge({ status }) {
  const label = status === "OK" ? "OK" : status === "MISMATCH" ? "Mismatch" : "Needs review";
  return <span className={"badge " + status}>{label}</span>;
}

function Sidebar({ view, setView }) {
  const items = [
    ["home", "Overview"],
    ["inbox", "Inbox"],
    ["review", "Review queue"],
  ];
  return (
    <div className="sidebar">
      <div className="brand">
        <h1>ShipVerify</h1>
        <p>Averis x Monash 2026</p>
      </div>
      {items.map(([key, label]) => (
        <div key={key} className={"nav-item" + (view.name === key ? " active" : "")}
             onClick={() => setView({ name: key })}>
          {label}
        </div>
      ))}
    </div>
  );
}

function Home({ data, overrides }) {
  const ids = Object.keys(data);
  const byCategory = {}, byStatus = {};
  ids.forEach(id => {
    const r = data[id].result;
    byCategory[r.category] = (byCategory[r.category] || 0) + 1;
    const s = finalStatus(id, r, overrides);
    byStatus[s] = (byStatus[s] || 0) + 1;
  });
  const reviewedCount = Object.keys(overrides).length;
  const pendingReview = ids.filter(id => data[id].result.status === "NEEDS_REVIEW" && !overrides[id]).length;

  return (
    <div>
      <h2>Overview</h2>
      <p className="subtitle">{ids.length} emails processed</p>
      <div className="stat-row">
        <div className="stat"><div className="n">{ids.length}</div><div className="l">total emails</div></div>
        <div className="stat"><div className="n">{byStatus.MISMATCH || 0}</div><div className="l">mismatches found</div></div>
        <div className="stat"><div className="n">{pendingReview}</div><div className="l">pending review</div></div>
        <div className="stat"><div className="n">{reviewedCount}</div><div className="l">reviewed</div></div>
      </div>
      <div className="panel">
        <div className="col-head">By category</div>
        {Object.entries(byCategory).map(([k, v]) => (
          <div key={k} style={{display:"flex", justifyContent:"space-between", padding:"6px 0", borderBottom:"1px solid var(--line)"}}>
            <span>{k}</span><span className="mono">{v}</span>
          </div>
        ))}
      </div>
    </div>
  );
}

function Inbox({ data, overrides, openCase }) {
  const [catFilter, setCatFilter] = useState("");
  const [statusFilter, setStatusFilter] = useState("");
  const [search, setSearch] = useState("");

  const rows = Object.entries(data).map(([id, d]) => ({
    id,
    from: d.email.from,
    subject: d.email.subject,
    category: d.result.category,
    status: finalStatus(id, d.result, overrides),
    reviewed: !!overrides[id],
  }));

  const cats = [...new Set(rows.map(r => r.category))].sort();
  const statuses = [...new Set(rows.map(r => r.status))].sort();

  const q = search.trim().toLowerCase();
  const filtered = rows.filter(r =>
    (!catFilter || r.category === catFilter) &&
    (!statusFilter || r.status === statusFilter) &&
    (!q || r.id.toLowerCase().includes(q) || r.from.toLowerCase().includes(q))
  );

  return (
    <div>
      <h2>Inbox</h2>
      <p className="subtitle">{filtered.length} of {rows.length} emails</p>
      <div className="filters">
        <input type="text" placeholder="Search by email ID or sender…" value={search}
               onChange={e => setSearch(e.target.value)} style={{minWidth:240}} />
        <select value={catFilter} onChange={e => setCatFilter(e.target.value)}>
          <option value="">All categories</option>
          {cats.map(c => <option key={c} value={c}>{c}</option>)}
        </select>
        <select value={statusFilter} onChange={e => setStatusFilter(e.target.value)}>
          <option value="">All statuses</option>
          {statuses.map(s => <option key={s} value={s}>{s}</option>)}
        </select>
      </div>
      <table>
        <thead><tr><th>Email ID</th><th>From</th><th>Subject</th><th>Category</th><th>Status</th></tr></thead>
        <tbody>
          {filtered.slice(0, 300).map(r => (
            <tr key={r.id} className="row" onClick={() => openCase(r.id)}>
              <td className="mono">{r.id}</td>
              <td>{r.from}</td>
              <td>{r.subject}</td>
              <td><CategoryTag category={r.category} /></td>
              <td><Badge status={r.status} />{r.reviewed && <span style={{marginLeft:6, color:"var(--text-dim)", fontSize:11}}>reviewed</span>}</td>
            </tr>
          ))}
        </tbody>
      </table>
      {filtered.length > 300 && <p className="subtitle" style={{marginTop:10}}>Showing first 300 — narrow with a filter to see more.</p>}
    </div>
  );
}

function FieldRow({ fc }) {
  const mark = fc.outcome === "MATCH" ? "✓" : fc.outcome === "MISMATCH" ? "✕" : "?";
  const color = fc.outcome === "MATCH" ? "var(--ok)" : fc.outcome === "MISMATCH" ? "var(--mismatch)" : "var(--review)";
  return (
    <div className="field-row">
      <div className="field-name">
        <span style={{color, marginRight:8, fontWeight:600}}>{mark}</span>
        {fc.field.replaceAll("_", " ")}
      </div>
      <div>
        <div className="col-head">SI</div>
        <div className="field-val">{fc.si.raw || "—"}</div>
        {fc.si.evidence && <div className="field-evidence">“{fc.si.evidence}”</div>}
      </div>
      <div>
        <div className="col-head">BL</div>
        <div className="field-val">{fc.bl.raw || "—"}</div>
        {fc.bl.evidence && <div className="field-evidence">“{fc.bl.evidence}”</div>}
      </div>
    </div>
  );
}

function CaseDetail({ id, data, overrides, back, openCase }) {
  const d = data[id];
  const r = d.result;
  const ov = overrides[id];
  const allIds = Object.keys(data);
  const idx = allIds.indexOf(id);
  const prevId = idx > 0 ? allIds[idx - 1] : null;
  const nextId = idx < allIds.length - 1 ? allIds[idx + 1] : null;

  return (
    <div>
      <div className="case-nav">
        <span className="back-link" onClick={back}>← Back to inbox</span>
        <div className="case-nav-btns">
          <button className="btn" disabled={!prevId} onClick={() => prevId && openCase(prevId)}>← Previous</button>
          <button className="btn" disabled={!nextId} onClick={() => nextId && openCase(nextId)}>Next →</button>
        </div>
      </div>
      <h2>{d.email.subject}</h2>
      <p className="subtitle">{id} · from {d.email.from} · {r.category}</p>

      {ov && (
        <div className="reviewed-note">
          Reviewed → <strong>{ov.status}</strong>
          {(ov.defect_fields || []).length > 0 && <> (fields: {(ov.defect_fields || []).join(", ")})</>}
          {ov.note && <> — {ov.note}</>}
        </div>
      )}

      <div className="panel">
        <div className="col-head">Email body</div>
        <div style={{whiteSpace:"pre-wrap", fontSize:13}}>{d.email.body}</div>
      </div>

      {r.category !== "BL_COMPARISON" ? (
        <div className="panel empty">Not a document-comparison email — nothing to compare.</div>
      ) : (r.fields || []).length === 0 ? (
        <div className="panel">
          <Badge status={r.status} />
          {r.review_reason && <span style={{marginLeft:10, color:"var(--text-dim)"}}>{r.review_reason}</span>}
        </div>
      ) : (
        <div className="panel">
          {(r.fields || []).map(fc => <FieldRow key={fc.field} fc={fc} />)}
        </div>
      )}
    </div>
  );
}

function ReviewQueue({ data, overrides, setOverrides, openCase }) {
  const pending = Object.entries(data).filter(([id, d]) =>
    d.result.status === "NEEDS_REVIEW" && !overrides[id]
  );

  const [decision, setDecision] = useState("OK");
  const [checkedFields, setCheckedFields] = useState([]);
  const [note, setNote] = useState("");

  if (pending.length === 0) {
    return <div><h2>Review queue</h2><div className="panel empty">Nothing pending — every flagged case has been reviewed.</div></div>;
  }

  const [id, d] = pending[0];
  const r = d.result;

  const toggleField = (f) => {
    setCheckedFields(prev => prev.includes(f) ? prev.filter(x => x !== f) : [...prev, f]);
  };

  const submit = async () => {
    const override = {
      status: decision,
      defect_fields: decision === "MISMATCH" ? checkedFields : [],
      note,
      reviewed_at: new Date().toISOString(),
    };
    await saveOverride(id, override);
    setOverrides({ ...overrides, [id]: override });
    setDecision("OK"); setCheckedFields([]); setNote("");
  };

  return (
    <div>
      <h2>Review queue</h2>
      <p className="subtitle">{pending.length} case(s) waiting for a decision</p>

      <div className="panel">
        <h2 style={{fontSize:15}}>{id} — {d.email.subject}</h2>
        <p className="subtitle">Reason: {r.review_reason || "unspecified"}</p>
        <div style={{whiteSpace:"pre-wrap", fontSize:13, marginBottom:14}}>{d.email.body}</div>

        {(r.fields || []).length > 0 && (r.fields || []).map(fc => (
          <div key={fc.field} style={{fontSize:13, padding:"4px 0"}}>
            <strong>{fc.field.replaceAll("_"," ")}</strong> — SI: <span className="mono">{fc.si.raw || "—"}</span> · BL: <span className="mono">{fc.bl.raw || "—"}</span>
          </div>
        ))}

        <div className="radio-group" style={{marginTop:16}}>
          <label><input type="radio" checked={decision==="OK"} onChange={() => setDecision("OK")} /> OK — no real mismatch</label>
          <label><input type="radio" checked={decision==="MISMATCH"} onChange={() => setDecision("MISMATCH")} /> Mismatch — real defect</label>
        </div>

        {decision === "MISMATCH" && (
          <div className="checkbox-list">
            {FIELDS.map(f => (
              <label key={f}>
                <input type="checkbox" checked={checkedFields.includes(f)} onChange={() => toggleField(f)} />
                {f.replaceAll("_"," ")}
              </label>
            ))}
          </div>
        )}

        <input type="text" placeholder="Note (optional)" value={note} onChange={e => setNote(e.target.value)}
               style={{width:"100%", marginTop:10, marginBottom:14}} />

        <button className="btn primary" onClick={submit}>Save decision and go to next case</button>
      </div>
    </div>
  );
}

function App() {
  const [data, setData] = useState(null);
  const [overrides, setOverrides] = useState({});
  const [view, setView] = useState({ name: "home" });
  const [error, setError] = useState(null);

  useEffect(() => {
    const resultsUrl = USING_FIREBASE ? `${FIREBASE_DB_URL}/results.json` : "results.json";
    fetch(resultsUrl)
      .then(r => { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
      .then(setData)
      .catch(e => setError(e.message || "Failed to load results"));
    loadOverrides().then(setOverrides).catch(() => {});
  }, []);

  if (error) return <div className="main"><div className="state-message error">Couldn't load data ({error}). Try refreshing the page.</div></div>;
  if (!data) return <div className="main"><div className="state-message">Loading ShipVerify…</div></div>;

  const openCase = (id) => setView({ name: "case", id });

  return (
    <React.Fragment>
      <Sidebar view={view} setView={setView} />
      <div className="main">
        {view.name === "home" && <Home data={data} overrides={overrides} />}
        {view.name === "inbox" && <Inbox data={data} overrides={overrides} openCase={openCase} />}
        {view.name === "case" && <CaseDetail id={view.id} data={data} overrides={overrides} back={() => setView({name:"inbox"})} openCase={openCase} />}
        {view.name === "review" && <ReviewQueue data={data} overrides={overrides} setOverrides={setOverrides} openCase={openCase} />}
      </div>
    </React.Fragment>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
